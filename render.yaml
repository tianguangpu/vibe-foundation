# Render 部署配置（放仓库根目录）。Render 连上仓库后会自动按这个文件建服务。
services:
  - type: web
    name: fastapi-starter
    env: python
    plan: free
    rootDir: fastapi-starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # JWT 密钥由 Render 自动生成一个随机值，不用手动填
      - key: FASTAPI_STARTER_SECRET
        generateValue: true
